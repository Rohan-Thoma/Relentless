"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  publish = "web"

[[edge_functions]]
  path = "/api/*"
  function = "api_proxy"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
