name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: relentless
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: ruff check .
      - env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/relentless
        run: python -m src.db_migrate
      - env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/relentless
          RELENTLESS_TEST_LIVE_DB: "1"
          ALLOW_EXAMPLE_PROFILE: "1"
        run: pytest -q
