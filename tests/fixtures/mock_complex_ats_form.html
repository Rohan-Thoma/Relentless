<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mock Complex ATS Form</title>
  <style>
    #cookie-overlay {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #333;
      color: #fff;
      padding: 15px;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <!-- Cookie Consent Banner -->
  <div id="cookie-overlay">
    <p>We use cookies to improve your experience.</p>
    <button id="onetrust-accept-btn-handler" onclick="document.getElementById('cookie-overlay').style.display='none'">
      Accept All
    </button>
  </div>

  <h1>Apply for Senior Machine Learning Engineer</h1>
  <form id="complexForm" action="/submit" method="post" enctype="multipart/form-data">
    <div class="field">
      <label for="first_name">First Name</label>
      <input type="text" id="first_name" name="first_name" required />
    </div>
    <div class="field">
      <label for="last_name">Last Name</label>
      <input type="text" id="last_name" name="last_name" required />
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />
    </div>
    <div class="field">
      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" required />
    </div>
    <div class="field">
      <label for="linkedin">LinkedIn</label>
      <input type="text" id="linkedin" name="linkedin" />
    </div>
    <div class="field">
      <label for="github">GitHub</label>
      <input type="text" id="github" name="github" />
    </div>
    <div class="field">
      <label for="work_auth">Authorized to work in India?</label>
      <select id="work_auth" name="work_auth" required>
        <option value="">Select...</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>
    <div class="field">
      <label for="notice_period">Notice Period</label>
      <input type="text" id="notice_period" name="notice_period" placeholder="e.g. 30 days" required />
    </div>
    <div class="field">
      <label for="essay_why">Why do you want to join our AI team?</label>
      <textarea id="essay_why" name="why_join" required></textarea>
    </div>
    <div class="field">
      <label for="resume">Resume (PDF)</label>
      <input type="file" id="resume" name="resume" accept="application/pdf" required />
    </div>
    <button type="submit" id="submit_btn">Submit Application</button>
  </form>
</body>
</html>
