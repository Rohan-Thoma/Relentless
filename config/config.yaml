# ============================================
# Relentless Job Search Agent - Config
# ============================================
# SMARTRECRUITERS: ATS with public Posting API.
#   URL format: https://jobs.smartrecruiters.com/{slug}/... or https://careers.smartrecruiters.com/{slug}
#   Example slugs: LinkedIn3, ServiceNow, IFS1, CheckPointSoftwareTechnologies2
# RECRUITEE: European/startup-focused ATS.
#   URL format: https://{slug}.recruitee.com/api/offers/
#   Example slugs: bunq, intermategroupgmbh, aquablu, curegroupgmbh
#
# WHY LIMITED BEFORE: smartrecruiters and recruitee arrays were EMPTY ([]),
# meaning this agent wasn't scanning thousands of available tech/AI employers.
#
# AUTOMATION EXPLANATION (current settings are NOT too relaxed — very strict):
#   apply_mode: DRY_RUN  -> NEVER submits applications (only prepares/evaluates)
#   daily_cap: 5          -> Max 5 SUBMITTED applications per 24 hours
#   per_company_cooldown_hours: 72 -> 3-day gap before applying to same company again
#   min_fit_prob: 0.70     -> Only applies if job match probability >= 70%
#   allowed_tiers: [strong_fit, dream_role] -> Only highest-quality matches
#   max_free_text_questions: 0 -> REJECTS any job with even 1 free-text question
#   first_company_confirm: True -> Requires confirmation before first submit
#
# TO ENABLE REAL SUBMISSIONS:
#   1. Change apply_mode to LIVE or AUTO_EASY
#   2. Set allowed_tiers to include good_fit if desired
#   3. Raise max_free_text_questions to 1 or 2
#   4. Optionally lower per_company_cooldown_hours to 24 or 48
#
# PRESETS (see automation_presets below):
#   safe = current strict settings (DRY_RUN, 0.70, 72h, 5/day)
#   balanced = 0.65 prob, 48h, 3/day, allows good_fit + 1 free-text
#   fast = 0.60 prob, 24h, 10/day, allows moderate_fit + 2 free-text
# ============================================

