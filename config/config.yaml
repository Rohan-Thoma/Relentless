automation:
  # PRESET SELECTOR: choose safe / balanced / fast
  # This tells YOU which preset is active. The values below are what the agent reads.
  # To switch presets: change this line, then adjust the automation values below.
  preset: safe
  apply_mode: DRY_RUN
  daily_cap: 5
  per_company_cooldown_hours: 72
  min_fit_prob: 0.7
  allowed_tiers:
  - strong_fit
  - dream_role
  max_free_text_questions: 0
  first_company_confirm: true
automation_presets:
  description: "Select preset by setting 'preset' above to safe / balanced / fast. The values here are reference configs. Default active preset: safe."
  safe:
    apply_mode: DRY_RUN
    daily_cap: 5
    per_company_cooldown_hours: 72
    min_fit_prob: 0.7
    allowed_tiers:
    - strong_fit
    - dream_role
    max_free_text_questions: 0
    first_company_confirm: true
    notes: Most restrictive. No submissions, only best tiers, 72h cooldown, 70% fit
      threshold. Safe for evaluation.
  balanced:
    apply_mode: DRY_RUN
    daily_cap: 3
    per_company_cooldown_hours: 48
    min_fit_prob: 0.65
    allowed_tiers:
    - strong_fit
    - dream_role
    - good_fit
    max_free_text_questions: 1
    first_company_confirm: true
    notes: Relaxed. Allows good_fit tier, 48h cooldown, 65% threshold, up to 1 free-text
      question. Good for broader scanning.
  fast:
    apply_mode: DRY_RUN
    daily_cap: 10
    per_company_cooldown_hours: 24
    min_fit_prob: 0.6
    allowed_tiers:
    - strong_fit
    - dream_role
    - good_fit
    - moderate_fit
    max_free_text_questions: 2
    first_company_confirm: false
    notes: Aggressive scanning. Low threshold, 24h cooldown, allows moderate tiers
      and up to 2 free-text questions. Use with caution. Toggle apply_mode to LIVE
      for real submissions.

jobboards:
  sites:
    - naukri
    - linkedin
    - indeed
    # Note: 'google' is excluded by default as Google Search blocks unproxied IP requests with 429.
  search_terms:
    - "Machine Learning Engineer"
    - "AI Engineer"
    - "Computer Vision Engineer"
    - "LLM Engineer"
  locations:
    - "Hyderabad, India"
    - "Bengaluru, India"
    - "India"
  results_wanted: 20
  hours_old: 72

gmail_scanner:
  lookback_days: 3
  label: "professional-job_alerts"
  sender_keywords:
    - linkedin
    - naukri
    - indeed
    - instahyre
    - wellfound
    - job
    - hiring
    - alert

ingestion:
  prioritize_scraping: true    # Scrape JobSpy + Gmail before crawling ATS
  scrape_only: true           # Set to true to bypass slow ATS boards completely
  enable_jobboards: true       # Enable JobSpy multi-board search
  enable_gmail: true           # Enable Gmail alert scanner
  enable_ats: false             # Enable company ATS targets (Greenhouse, Lever, etc.)


